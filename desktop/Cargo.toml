[package]
name = "img-desktop"
version.workspace = true
edition = "2024"
publish = false

[features]
perf = ["dep:gpui-profiler"]

[dependencies]
img-records = { path = "../crates/img-records" }
global-hotkey = "0.8"
gpui-profiler = { package = "gpui-pre", version = "=0.3.3", features = ["profiler"], optional = true }
gpui-kit = "=0.6.0"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
directories = "6"
uuid = { version = "1", features = ["v4"] }
rust-embed = { version = "8", features = ["debug-embed"] }
tempfile = "3"
url = "2"
resvg = { version = "0.46", default-features = false }
semver = "1"
sha2 = "0.10"
quick-xml = "0.41"
futures-channel = "0.3"
futures-lite = "2"
async-channel = "2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSMenu", "NSMenuItem", "NSApplication", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSObject", "NSString"] }

[target.'cfg(target_os = "windows")'.dependencies]
tray-icon = { version = "=0.24.2", default-features = false }
keyring = { version = "=3.6.3", features = ["windows-native"] }
[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "=0.3.6", features = ["blocking"] }
ashpd = { version = "=0.13.13", default-features = false, features = ["tokio", "global_shortcuts"] }
tokio = { version = "1", features = ["rt", "time", "macros"] }
keyring = { version = "=3.6.3", features = ["sync-secret-service", "crypto-rust"] }
