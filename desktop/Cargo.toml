[package]
name = "img-desktop"
version.workspace = true
edition = "2024"
publish = false

[features]
perf = ["dep:gpui-profiler"]

[dependencies]
gpui-profiler = { package = "gpui-pre", version = "=0.3.3", features = ["profiler"], optional = true }
gpui-kit = "=0.6.0"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
directories = "6"
uuid = { version = "1", features = ["v4"] }
rust-embed = { version = "8", features = ["debug-embed"] }
tempfile = "3"
url = "2"
resvg = { version = "0.46", default-features = false }
semver = "1"
sha2 = "0.10"
quick-xml = "0.41"
futures-channel = "0.3"
futures-lite = "2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
