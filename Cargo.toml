[workspace]
members = ["crates/img-core", "crates/img-cli", "crates/img-records", "desktop"]
default-members = ["crates/img-core", "crates/img-cli"]
resolver = "3"

[workspace.package]
version = "0.4.0"
edition = "2024"
repository = "https://github.com/liyown/img"

[profile.dev]
debug = 0

# Keep image previews responsive when running the native app from a development build.
[profile.dev.package.img-core]
opt-level = 2

[profile.dev.package.image]
opt-level = 3

[profile.dev.package.image-webp]
opt-level = 3

[profile.dev.package.webp]
opt-level = 3

[profile.dev.package.libwebp-sys]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.flate2]
opt-level = 3

[profile.dev.package.zlib-rs]
opt-level = 3

[profile.release]
strip = "debuginfo"
