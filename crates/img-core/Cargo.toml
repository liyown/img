[package]
name = "img-core"
version.workspace = true
edition.workspace = true
repository.workspace = true
publish = false

[dependencies]
webp = { version = "0.3.1", default-features = false }
ab_glyph = "0.2"
tiny-skia = "0.11"
pulldown-cmark = { version = "0.13", default-features = false }
html-escape = "0.2"
# Use the optimized Rust DEFLATE backend for PNG, including the shared image decoder.
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
img-records = { path = "../img-records" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
directories = "6"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
url = "2"
regex = "1"
sha2 = "0.10"
chrono = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls", "json", "multipart", "query", "system-proxy"] }
aws-config = "1"
aws-credential-types = "1"
aws-sigv4 = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
base64 = "0.22"
quick-xml = { version = "0.41", features = ["serialize"] }
percent-encoding = "2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"

[dev-dependencies]
rusqlite = "0.40.2"
tiny_http = "0.12"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "=3.6.3", features = ["windows-native"] }
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", features = ["sync-secret-service", "crypto-rust"] }
