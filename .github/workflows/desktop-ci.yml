name: Desktop CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            artifact: arm64
          - runner: macos-15-intel
            arch: x86_64
            artifact: x86_64
          - runner: ubuntu-24.04
            arch: x86_64
            artifact: linux-x86_64
          - runner: windows-latest
            arch: x86_64
            artifact: windows-x86_64
    runs-on: ${{ matrix.runner }}
    env:
      IMG_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libfontconfig1-dev libssl-dev libasound2-dev libvulkan-dev libgit2-dev cmake clang pkg-config xvfb mesa-vulkan-drivers
      - run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy && rustup default 1.98.1
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --workspace
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Compile Windows region capture helper
        if: runner.os == 'Windows'
        shell: powershell
        env:
          IMG_CAPTURE_VALIDATE: '1'
        run: ./crates/img-cli/src/capture-windows.ps1
      - name: Build local release packages without a release tag
        if: runner.os == 'macOS'
        run: ./desktop/package.sh --unsigned
      - name: First install, upgrade, bundled CLI and tamper rejection
        if: runner.os == 'macOS'
        run: python3 scripts/test-installers.py --gui-only
      - name: Verify bundle signature and metadata
        if: runner.os == 'macOS'
        run: |
          codesign --verify --deep --strict "target/desktop/$IMG_ARCH/Img.app"
          plutil -lint "target/desktop/$IMG_ARCH/Img.app/Contents/Info.plist"
      - name: Build Windows and Linux packages
        if: runner.os != 'macOS'
        run: python scripts/package-desktop.py
      - name: Verify Windows and Linux packages
        if: runner.os != 'macOS'
        run: python scripts/test-desktop-package.py
      - name: Native window smoke test (Linux software renderer)
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a python3 scripts/smoke-desktop.py
      - name: Native window smoke test
        if: runner.os != 'Linux'
        run: python scripts/smoke-desktop.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-ci-${{ matrix.artifact }}
          path: dist/desktop/${{ matrix.artifact }}/
          if-no-files-found: error
