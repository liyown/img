name: Desktop CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      IMG_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy && rustup default 1.98.1
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --workspace
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Build local release packages without a release tag
        run: ./desktop/package.sh --unsigned
      - name: First install, upgrade, bundled CLI and tamper rejection
        run: python3 scripts/test-installers.py --gui-only
      - name: Verify bundle signature and metadata
        run: |
          codesign --verify --deep --strict "target/desktop/$IMG_ARCH/Img.app"
          plutil -lint "target/desktop/$IMG_ARCH/Img.app/Contents/Info.plist"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-ci-${{ matrix.arch }}
          path: dist/desktop/${{ matrix.arch }}/
          if-no-files-found: error
