name: CLI CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15, windows-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Set up Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - run: cargo +1.98.1 fmt --all -- --check
      - run: cargo +1.98.1 test --locked -p img-core -p img-cli
      - run: cargo +1.98.1 clippy --locked -p img-core -p img-cli --all-targets -- -D warnings
